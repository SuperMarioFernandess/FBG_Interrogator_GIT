name: Chat16 materialize validation

on:
  push:
    branches: [chat16-validation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', 'Materialize chat16 candidate') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patch
        shell: bash
        run: |
          cat .chat16-validation/patch.*.b64 | base64 --decode | gzip --decompress > /tmp/chat16.patch
          git apply --check /tmp/chat16.patch
          git apply /tmp/chat16.patch

      - name: Remove validation transport
        shell: bash
        run: |
          rm -rf .chat16-validation
          rm -f .github/workflows/chat16-validation.yml

      - name: Commit candidate
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chat16@local"
          git add -A
          git commit -m "Materialize chat16 candidate"
          git push origin HEAD:chat16-validation
