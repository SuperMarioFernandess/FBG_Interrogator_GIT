name: Chat 12 validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff + core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Apply chat 12 patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip
          p0 = Path('.chat12/patch.00').read_text()
          # The connector write lost one byte in the first chunk; restore it deterministically.
          p0 = p0[:4079] + 'Z' + p0[4079:]
          encoded = p0 + Path('.chat12/patch.01').read_text() + Path('.chat12/patch.02').read_text() + Path('.chat12/patch.03').read_text()
          patch = gzip.decompress(base64.b64decode(encoded))
          Path('chat12.patch').write_bytes(patch)
          import subprocess
          subprocess.run(['git', 'apply', '--check', 'chat12.patch'], check=True)
          subprocess.run(['git', 'apply', 'chat12.patch'], check=True)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff

      - name: Ruff check
        run: ruff check fbg tests main.py

      - name: Ruff format check
        run: ruff format --check fbg tests main.py

      - name: Core tests
        run: pytest tests -m "not ui and not slow" -q

  full:
    name: Full pytest
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Apply chat 12 patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, subprocess
          p0 = Path('.chat12/patch.00').read_text()
          p0 = p0[:4079] + 'Z' + p0[4079:]
          encoded = p0 + Path('.chat12/patch.01').read_text() + Path('.chat12/patch.02').read_text() + Path('.chat12/patch.03').read_text()
          Path('chat12.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          subprocess.run(['git', 'apply', '--check', 'chat12.patch'], check=True)
          subprocess.run(['git', 'apply', 'chat12.patch'], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff PySide6 pyqtgraph
      - name: Full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  ui:
    name: UI offscreen
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Apply chat 12 patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, subprocess
          p0 = Path('.chat12/patch.00').read_text()
          p0 = p0[:4079] + 'Z' + p0[4079:]
          encoded = p0 + Path('.chat12/patch.01').read_text() + Path('.chat12/patch.02').read_text() + Path('.chat12/patch.03').read_text()
          Path('chat12.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          subprocess.run(['git', 'apply', '--check', 'chat12.patch'], check=True)
          subprocess.run(['git', 'apply', 'chat12.patch'], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -m ui -q

  slow:
    name: Slow 2 kHz
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Apply chat 12 patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, subprocess
          p0 = Path('.chat12/patch.00').read_text()
          p0 = p0[:4079] + 'Z' + p0[4079:]
          encoded = p0 + Path('.chat12/patch.01').read_text() + Path('.chat12/patch.02').read_text() + Path('.chat12/patch.03').read_text()
          Path('chat12.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          subprocess.run(['git', 'apply', '--check', 'chat12.patch'], check=True)
          subprocess.run(['git', 'apply', 'chat12.patch'], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Slow tests
        run: pytest -m slow -q -s
