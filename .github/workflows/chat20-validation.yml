name: Chat 20 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = "".join(
              part.read_text(encoding="ascii").strip()
              for part in sorted(Path(".chat20_validation").glob("part-*"))
          )
          Path("chat20.patch").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply chat20.patch
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pytest-cov ruff
      - name: Mechanical lint fixes for validation copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fbg/ui/panels/measurement.py")
          text = path.read_text(encoding="utf-8")
          if "from dataclasses import replace" not in text:
              text = text.replace(
                  "import threading\nfrom pathlib import Path\n",
                  "import threading\nfrom dataclasses import replace\nfrom pathlib import Path\n",
                  1,
              )
              path.write_text(text, encoding="utf-8")

          path = Path("fbg/ui/graph_range.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_FROM), 1, 0)\n"
              "        layout.addWidget(self.x_from, 1, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_TO), 1, 2)\n"
              "        layout.addWidget(self.x_to, 1, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MODE), 2, 0)\n"
              "        layout.addWidget(self.y_mode, 2, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MIN), 2, 2)\n"
              "        layout.addWidget(self.y_min, 2, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MAX), 3, 0)\n"
              "        layout.addWidget(self.y_max, 3, 1)\n"
              "        layout.addWidget(self.show_all_button, 3, 2, 1, 2)\n"
              "        layout.setColumnStretch(4, 1)\n",
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_FROM), 0, 4)\n"
              "        layout.addWidget(self.x_from, 0, 5)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_TO), 0, 6)\n"
              "        layout.addWidget(self.x_to, 0, 7)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MODE), 1, 0)\n"
              "        layout.addWidget(self.y_mode, 1, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MIN), 1, 2)\n"
              "        layout.addWidget(self.y_min, 1, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MAX), 1, 4)\n"
              "        layout.addWidget(self.y_max, 1, 5)\n"
              "        layout.addWidget(self.show_all_button, 1, 6, 1, 2)\n"
              "        layout.setColumnStretch(8, 1)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          for panel_name in (
              "fbg/ui/panels/measurement.py",
              "fbg/ui/panels/sensors.py",
          ):
              path = Path(panel_name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("setMinimumHeight(220)", "setMinimumHeight(160)", 1)
              path.write_text(text, encoding="utf-8")

          path = Path("fbg/ui/models.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        if compensation is not None and compensation.reference in by_id:\n"
              "            if compensation.reference not in needed:\n"
              "                needed.append(compensation.reference)\n",
              "        if (\n"
              "            compensation is not None\n"
              "            and compensation.reference in by_id\n"
              "            and compensation.reference not in needed\n"
              "        ):\n"
              "            needed.append(compensation.reference)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("fbg/ui/graph_range.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_FROM), 1, 0)\n"
              "        layout.addWidget(self.x_from, 1, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_TO), 1, 2)\n"
              "        layout.addWidget(self.x_to, 1, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MODE), 2, 0)\n"
              "        layout.addWidget(self.y_mode, 2, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MIN), 2, 2)\n"
              "        layout.addWidget(self.y_min, 2, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MAX), 3, 0)\n"
              "        layout.addWidget(self.y_max, 3, 1)\n"
              "        layout.addWidget(self.show_all_button, 3, 2, 1, 2)\n"
              "        layout.setColumnStretch(4, 1)\n",
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_FROM), 0, 4)\n"
              "        layout.addWidget(self.x_from, 0, 5)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_X_TO), 0, 6)\n"
              "        layout.addWidget(self.x_to, 0, 7)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MODE), 1, 0)\n"
              "        layout.addWidget(self.y_mode, 1, 1)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MIN), 1, 2)\n"
              "        layout.addWidget(self.y_min, 1, 3)\n"
              "        layout.addWidget(QLabel(texts.LABEL_GRAPH_Y_MAX), 1, 4)\n"
              "        layout.addWidget(self.y_max, 1, 5)\n"
              "        layout.addWidget(self.show_all_button, 1, 6, 1, 2)\n"
              "        layout.setColumnStretch(8, 1)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          for panel_name in (
              "fbg/ui/panels/measurement.py",
              "fbg/ui/panels/sensors.py",
          ):
              path = Path(panel_name)
              text = path.read_text(encoding="utf-8")
              text = text.replace("setMinimumHeight(220)", "setMinimumHeight(160)", 1)
              path.write_text(text, encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes fbg tests main.py || true
          ruff format fbg tests main.py
      - run: ruff check fbg tests main.py
      - run: ruff format --check fbg tests main.py
      - run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing
      - name: Build implementation patch artifact
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@openai.com
          git add fbg tests
          if ! git diff --cached --quiet; then
            git commit -m "Chat 20: graph history and operator controls"
            git format-patch -1 --stdout > chat20_graphs.mbox
          else
            : > chat20_graphs.mbox
          fi
      - name: Upload implementation patch
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: chat20-implementation
          path: chat20_graphs.mbox
          if-no-files-found: error

