name: Chat 20 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          cat .chat20_validation/part-* | base64 -d | gzip -d > /tmp/chat20.patch
          git apply /tmp/chat20.patch
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pytest-cov ruff
      - run: ruff check fbg tests main.py
      - run: ruff format --check fbg tests main.py
      - run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing

  ui:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          cat .chat20_validation/part-* | base64 -d | gzip -d > /tmp/chat20.patch
          git apply /tmp/chat20.patch
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest PySide6 pyqtgraph
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          cat .chat20_validation/part-* | base64 -d | gzip -d > /tmp/chat20.patch
          git apply /tmp/chat20.patch
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest
      - run: pytest tests -m slow -q -s
