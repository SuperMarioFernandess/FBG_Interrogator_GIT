name: Chat 20 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = "".join(
              part.read_text(encoding="ascii").strip()
              for part in sorted(Path(".chat20_validation").glob("part-*"))
          )
          Path("chat20.patch").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply chat20.patch
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pytest-cov ruff
      - name: Mechanical lint fixes for validation copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fbg/ui/panels/measurement.py")
          text = path.read_text(encoding="utf-8")
          if "from dataclasses import replace" not in text:
              marker = "from __future__ import annotations\n"
              text = text.replace(marker, marker + "\nfrom dataclasses import replace\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
          ruff check --fix --unsafe-fixes fbg tests main.py || true
          ruff format fbg tests main.py
      - run: ruff check fbg tests main.py
      - run: ruff format --check fbg tests main.py
      - run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing
      - name: Build implementation patch artifact
        if: matrix.os == 'ubuntu-latest' && always()
        shell: bash
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@openai.com
          git add fbg tests
          if ! git diff --cached --quiet; then
            git commit -m "Chat 20: graph history and operator controls"
            git format-patch -1 --stdout > chat20_graphs.mbox
          else
            : > chat20_graphs.mbox
          fi
      - name: Upload implementation patch
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: chat20-implementation
          path: chat20_graphs.mbox
          if-no-files-found: error

  ui:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = "".join(
              part.read_text(encoding="ascii").strip()
              for part in sorted(Path(".chat20_validation").glob("part-*"))
          )
          Path("chat20.patch").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply chat20.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("fbg/ui/panels/measurement.py")
          text = path.read_text(encoding="utf-8")
          if "from dataclasses import replace" not in text:
              marker = "from __future__ import annotations\n"
              text = text.replace(marker, marker + "\nfrom dataclasses import replace\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest ruff PySide6 pyqtgraph
      - run: ruff check --fix --unsafe-fixes fbg tests main.py
      - run: ruff format fbg tests main.py
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Chat 20 implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          payload = "".join(
              part.read_text(encoding="ascii").strip()
              for part in sorted(Path(".chat20_validation").glob("part-*"))
          )
          Path("chat20.patch").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply chat20.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("fbg/ui/panels/measurement.py")
          text = path.read_text(encoding="utf-8")
          if "from dataclasses import replace" not in text:
              marker = "from __future__ import annotations\n"
              text = text.replace(marker, marker + "\nfrom dataclasses import replace\n", 1)
              path.write_text(text, encoding="utf-8")
          PY
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest ruff
      - run: ruff check --fix --unsafe-fixes fbg tests main.py
      - run: ruff format fbg tests main.py
      - run: pytest tests -m slow -q -s
