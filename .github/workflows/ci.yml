name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Ядро (без Qt)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч chat18 для временной валидации
        shell: bash
        run: |
          cat chat18_ci_part_* | git apply -
          git apply chat18_ci_fix.patch
          git apply chat18_ci_format.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей ядра
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff

      - name: Проверка стиля
        run: ruff check fbg tests main.py

      - name: Проверка форматирования
        run: ruff format --check fbg tests main.py

      - name: Тесты ядра
        run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing

  ui:
    name: Интерфейс (offscreen)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч chat18 для временной валидации
        shell: bash
        run: |
          cat chat18_ci_part_* | git apply -
          git apply chat18_ci_fix.patch
          git apply chat18_ci_format.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Платформа offscreen всё равно линкуется с libEGL и libGL:
      # без них PySide6 не импортируется даже без экрана.
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: Тесты интерфейса
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    name: Нагрузочный тест 2 кГц
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч chat18 для временной валидации
        shell: bash
        run: |
          cat chat18_ci_part_* | git apply -
          git apply chat18_ci_fix.patch
          git apply chat18_ci_format.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Симулятор 2000 кадров/с на loopback
        run: pytest tests -m slow -q -s

  package:
    name: Сформировать mbox chat18
    runs-on: ubuntu-latest
    needs: [core, ui, load]
    steps:
      - uses: actions/checkout@v4

      - name: Применить проверенный патч chat18
        shell: bash
        run: |
          cat chat18_ci_part_* | git apply -
          git apply chat18_ci_fix.patch
          git apply chat18_ci_format.patch

      - name: Сформировать git format-patch
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add fbg tests main.py pyproject.toml README.md
          git commit -m "Chat 18: calibration points and test debts"
          git format-patch --stdout HEAD^ > chat18_calibration_points.mbox
          git status --short

      - name: Загрузить mbox
        uses: actions/upload-artifact@v4
        with:
          name: chat18_calibration_points
          path: chat18_calibration_points.mbox
          if-no-files-found: error
          retention-days: 7
