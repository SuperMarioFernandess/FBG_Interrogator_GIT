name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  normalize:
    name: Chat 13 — нормализация патча
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Скачать проверенный патч предыдущего прогона
        uses: actions/download-artifact@v4
        with:
          name: chat13-normalized-patch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 33736295351

      - name: Применить проверенный патч и deltas чата 13
        shell: bash
        run: |
          git apply --index chat13_normalized.patch
          base64 -d chat13_delta.patch.gz.b64 > /tmp/chat13_delta.patch.gz
          gzip -dc /tmp/chat13_delta.patch.gz > /tmp/chat13_delta.patch
          git apply /tmp/chat13_delta.patch
          base64 -d chat13_sources_delta.patch.gz.b64 > /tmp/chat13_sources_delta.patch.gz
          gzip -dc /tmp/chat13_sources_delta.patch.gz > /tmp/chat13_sources_delta.patch
          git apply /tmp/chat13_sources_delta.patch
          git add -A README.md fbg tests main.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Нормализовать форматирование
        run: |
          ruff format fbg tests main.py
          git add -u
          ruff check fbg tests main.py
          ruff format --check fbg tests main.py

      - name: Собрать нормализованный diff
        shell: bash
        run: git diff --cached --binary > chat13_final.patch

      - uses: actions/upload-artifact@v4
        with:
          name: chat13-final-patch
          path: chat13_final.patch
          if-no-files-found: error

  core:
    name: Ядро (без Qt)
    runs-on: ${{ matrix.os }}
    needs: normalize
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chat13-final-patch

      - name: Применить финальный патч
        shell: bash
        run: git apply --index chat13_final.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей ядра
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff

      - name: Проверка стиля
        run: ruff check fbg tests main.py

      - name: Проверка форматирования
        run: ruff format --check fbg tests main.py

      - name: Тесты ядра
        run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing

  ui:
    name: Интерфейс (offscreen)
    runs-on: ubuntu-latest
    needs: [normalize, core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chat13-final-patch

      - name: Применить финальный патч
        run: git apply --index chat13_final.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: Тесты интерфейса
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    name: Нагрузочный тест 2 кГц
    runs-on: ubuntu-latest
    needs: [normalize, core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chat13-final-patch

      - name: Применить финальный патч
        run: git apply --index chat13_final.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Симулятор 2000 кадров/с на loopback
        run: pytest tests -m slow -q -s

  chat13-full:
    name: Chat 13 — полный pytest
    runs-on: ubuntu-latest
    needs: [normalize, core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chat13-final-patch

      - name: Применить финальный патч
        run: git apply --index chat13_final.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: Полный pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q
