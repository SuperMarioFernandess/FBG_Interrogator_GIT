name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  core:
    name: Ядро (без Qt)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч чата 13
        shell: bash
        run: |
          base64 -d chat13_validation.patch.gz.b64 > /tmp/chat13.patch.gz
          gzip -dc /tmp/chat13.patch.gz > /tmp/chat13.patch
          git apply --index /tmp/chat13.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей ядра
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff

      - name: Проверка ruff
        id: ruff
        shell: bash
        continue-on-error: true
        run: |
          status=0
          ruff check fbg tests main.py 2>&1 | tee /tmp/ruff.txt || status=1
          ruff format --check fbg tests main.py 2>&1 | tee -a /tmp/ruff.txt || status=1
          exit "$status"

      - name: Опубликовать диагностику ruff
        if: steps.ruff.outcome == 'failure' && matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```text'; cat /tmp/ruff.txt; echo '```'; } | gh pr comment 3 --body-file -

      - name: Остановить job при ошибке ruff
        if: steps.ruff.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Тесты ядра
        run: pytest tests -m "not ui and not slow" -q --cov=fbg --cov-report=term-missing

  ui:
    name: Интерфейс (offscreen)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч чата 13
        shell: bash
        run: |
          base64 -d chat13_validation.patch.gz.b64 > /tmp/chat13.patch.gz
          gzip -dc /tmp/chat13.patch.gz > /tmp/chat13.patch
          git apply --index /tmp/chat13.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Платформа offscreen всё равно линкуется с libEGL и libGL:
      # без них PySide6 не импортируется даже без экрана.
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: Тесты интерфейса
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    name: Нагрузочный тест 2 кГц
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч чата 13
        shell: bash
        run: |
          base64 -d chat13_validation.patch.gz.b64 > /tmp/chat13.patch.gz
          gzip -dc /tmp/chat13.patch.gz > /tmp/chat13.patch
          git apply --index /tmp/chat13.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Симулятор 2000 кадров/с на loopback
        run: pytest tests -m slow -q -s

  chat13-full:
    name: Chat 13 — полный pytest
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Применить патч чата 13
        shell: bash
        run: |
          base64 -d chat13_validation.patch.gz.b64 > /tmp/chat13.patch.gz
          gzip -dc /tmp/chat13_validation.patch.gz > /tmp/chat13.patch
          git apply --index /tmp/chat13.patch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: Полный pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -q
