name: Chat 14 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    name: Chat14 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply chat14 patch
        shell: bash
        run: |
          python -c "import base64,gzip,pathlib; d=''.join(pathlib.Path(f'.chat14/patch.part{i}').read_text() for i in range(1,5)); pathlib.Path('chat14.patch').write_bytes(gzip.decompress(base64.b64decode(d)))"
          git apply --check chat14.patch
          git apply chat14.patch
          python .chat14/normalize.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff

      - name: Ruff
        run: ruff check fbg tests main.py

      - name: Ruff format
        run: ruff format --check fbg tests main.py

      - name: Tests without Qt and slow
        run: pytest tests -m "not ui and not slow" -q

  ui:
    name: Chat14 UI offscreen
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply chat14 patch
        shell: bash
        run: |
          python -c "import base64,gzip,pathlib; d=''.join(pathlib.Path(f'.chat14/patch.part{i}').read_text() for i in range(1,5)); pathlib.Path('chat14.patch').write_bytes(gzip.decompress(base64.b64decode(d)))"
          git apply --check chat14.patch
          git apply chat14.patch
          python .chat14/normalize.py

      - name: System Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph

      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  load:
    name: Chat14 slow
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply chat14 patch
        shell: bash
        run: |
          python -c "import base64,gzip,pathlib; d=''.join(pathlib.Path(f'.chat14/patch.part{i}').read_text() for i in range(1,5)); pathlib.Path('chat14.patch').write_bytes(gzip.decompress(base64.b64decode(d)))"
          git apply --check chat14.patch
          git apply chat14.patch
          python .chat14/normalize.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Slow tests
        run: pytest tests -m slow -q -s
