name: Chat 12 ruff diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply chat 12 patch
        shell: python
        run: |
          from pathlib import Path
          import base64, gzip, subprocess
          p0 = Path('.chat12/patch.00').read_text()
          p0 = p0[:4079] + 'Z' + p0[4079:]
          encoded = p0 + Path('.chat12/patch.01').read_text() + Path('.chat12/patch.02').read_text() + Path('.chat12/patch.03').read_text()
          Path('chat12.patch').write_bytes(gzip.decompress(base64.b64decode(encoded)))
          subprocess.run(['git', 'apply', 'chat12.patch'], check=True)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Report ruff output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          ruff check fbg tests main.py --output-format concise > ruff.txt 2>&1
          rc=$?
          {
            echo 'Chat 12 ruff diagnostic:'
            echo '```text'
            cat ruff.txt
            echo '```'
          } > body.txt
          gh pr comment ${{ github.event.pull_request.number }} --body-file body.txt
          exit $rc
