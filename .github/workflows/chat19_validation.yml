name: Chat 19 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply chat19 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = (
              ".chat19-validation/gzchunk_00",
              ".chat19-validation/gzchunk_01",
              ".chat19-validation/gz2_0",
              ".chat19-validation/gz2_1",
              ".chat19-validation/gz2_2",
          )
          payload = "".join(Path(part).read_text(encoding="ascii") for part in parts)
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff
      - name: Ruff
        run: |
          ruff format fbg tests main.py
          ruff check fbg tests main.py
          ruff format --check fbg tests main.py
      - name: Core tests
        run: pytest tests -m "not ui and not slow" -q

  ui:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 UI
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Apply chat19 patch
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = (
              ".chat19-validation/gzchunk_00",
              ".chat19-validation/gzchunk_01",
              ".chat19-validation/gz2_0",
              ".chat19-validation/gz2_1",
              ".chat19-validation/gz2_2",
          )
          payload = "".join(Path(part).read_text(encoding="ascii") for part in parts)
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_ui_measurement_widget.py")
          text = path.read_text()
          text = text.replace(
              "import time\nfrom collections.abc import Iterator\n",
              "import time\nfrom collections.abc import Iterator\nfrom dataclasses import replace\n",
          )
          text = text.replace(
              "    controller.pipeline.publish_now()\n    panel.refresh(controller.snapshot())\n\n    assert resets == 0\n",
              "    controller.pipeline.publish_now()\n    snapshot = controller.snapshot()\n"
              "    panel.refresh(replace(snapshot, ui=controller.pipeline.snapshot()))\n\n"
              "    assert resets == 0\n",
              1,
          )
          path.write_text(text)
          PY
      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  slow:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 slow
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply chat19 patch
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          parts = (
              ".chat19-validation/gzchunk_00",
              ".chat19-validation/gzchunk_01",
              ".chat19-validation/gz2_0",
              ".chat19-validation/gz2_1",
              ".chat19-validation/gz2_2",
          )
          payload = "".join(Path(part).read_text(encoding="ascii") for part in parts)
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
      - name: Install slow-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Slow tests
        run: pytest tests -m slow -q -s
