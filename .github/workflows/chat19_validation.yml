name: Chat 19 validation

on:
  pull_request:
    branches: [main]

jobs:
  core:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply chat19 patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path(".chat19-validation/chat19_patch.mbox.gz.b64").read_text(encoding="ascii")
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest pytest-cov ruff
      - name: Ruff
        run: |
          ruff check fbg tests main.py
          ruff format --check fbg tests main.py
      - name: Core tests
        run: pytest tests -m "not ui and not slow" -q

  ui:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 UI
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Apply chat19 patch
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path(".chat19-validation/chat19_patch.mbox.gz.b64").read_text(encoding="ascii")
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest PySide6 pyqtgraph
      - name: UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests -m ui -q

  slow:
    if: github.head_ref == 'chat19-validation'
    name: Chat19 slow
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply chat19 patch
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path(".chat19-validation/chat19_patch.mbox.gz.b64").read_text(encoding="ascii")
          Path("chat19_validation.mbox").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git config user.name "ChatGPT validation"
          git config user.email "chatgpt-validation@users.noreply.github.com"
          git am chat19_validation.mbox
      - name: Install slow-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest
      - name: Slow tests
        run: pytest tests -m slow -q -s
